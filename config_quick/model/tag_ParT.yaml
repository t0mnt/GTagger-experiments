_target_: experiments.tagging.wrappers.ParTWrapper
in_channels: null
out_channels: null
use_amp: false
add_fourmomenta_backbone: false
compile: false                  # quick tree stays eager; compile smoke is env-gated (CGENN_COMPILE_GATES=1)

net:
 _target_: experiments.baselines.particletransformer.ParticleTransformer
 preserve_variance: true  # lloca 2.0: 1/gamma rescaling of transported q/k/v (p_ref = jet momentum from the wrapper)
 _partial_: true
 input_dim: null
 num_classes: null

 attn_reps: 8x0n+2x1n

 use_amp: ${model.use_amp}
 trim: true

 use_pre_activation_pair: false
 pair_input_dim: 4
 cls_block_params:
  dropout: 0
  attn_dropout: 0
  activation_dropout: 0
 version: 1

defaults:
 - framesnet: identity
