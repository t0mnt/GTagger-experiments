_target_: experiments.tagging.wrappers.CGENNWrapper
out_channels: null
compile: false  # quick tree stays eager; compile smoke is env-gated (CGENN_COMPILE_GATES=1)
activation_memory_budget: null  # OOM escape hatch only: fraction in (0,1] handed to
                                # AOT's partitioner, buying peak activation memory with
                                # backward recompute (lgatr 2.0's knob). null = torch
                                # default. Try the sparse gp_impl first -- it already
                                # cut retained activations 3.5x for free.

net:
 _target_: experiments.baselines.cgenn.cgenn.CGENN
 _partial_: true

 in_features_h: null
 hidden_features_h: 8
 in_features_x: 1
 hidden_features_x: 2
 decoder_features: 16
 n_outputs: null
 n_layers: 1
 dropout: 0.0
 # campaign posture (lgatr-2.0 sparse_gp default analog); the BIT/reference gates pin
 # gp_impl=einsum explicitly, so the suite exercises sparse while fixtures stay valid
 gp_impl: sparse

defaults:
 - framesnet: identity
