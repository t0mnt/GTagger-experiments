exp_type: toptagxl
exp_name: toptagxl

data:
 data_dir: data/toptagxl
 features: default
 data_config: null
 train_files_range: [0, 500]
 test_files_range: [500, 625]
 val_files_range: [625, 675]

topxl_params:
 # Kept at UPSTREAM's 2 (theirs, not ours) and overridden to 8 by the sbatch, as jctagging is (same
 # weaver SimpleIterDataset, same scale: [0,500] is 500 files PER CLASS x 2 = 1000, as JetClass is
 # 100 x 10). The starvation was measured on JetClass, not here -- check `nvidia-smi dmon -s u` on
 # the first XL run and drop the sbatch override if the GPU is already saturated.
 num_workers: 2
 fetch_step: 0.01
 extra_selection: null
 extra-test-selection: null
 fetch_by_files: false
 in_memory: False
 not_remake_weights: False
 steps_per_epoch: null
 steps_per_epoch_val: null
 events_per_file: 100000
 async_load: true
 split_num: 1

evaluation:
 batchsize: 2048
 eval_set: [test]

plotting:
 roc: true
 score: true

defaults:
 - training: jc_transformer
 - tagging
 - _self_
