_target_: experiments.tagging.wrappers.CGENNWrapper
out_channels: null
# no use_amp key: this wrapper has no autocast and does not accept one; the
# GradScaler still reads cfg.model.use_amp, which defaults to False.
compile: true  # torch.compile(net, dynamic=True); wrapper stays eager (docs/cgenn-compile.md; operator-adopted default)
activation_memory_budget: null  # OOM escape hatch only: fraction in (0,1] handed to
                                # AOT's partitioner, buying peak activation memory with
                                # backward recompute (lgatr 2.0's knob). null = torch
                                # default. NOTE the sparse gp_impl does NOT relieve this
                                # under compile: AOT's partitioner equalizes retention
                                # across all three impls (its 3.5x is eager-only --
                                # docs/cgenn-compile.md, CORRECTION).

net:
 _target_: experiments.baselines.cgenn.cgenn.CGENN
 _partial_: true

 in_features_h: null
 hidden_features_h: 72
 in_features_x: 1
 hidden_features_x: 8
 decoder_features: 64
 n_outputs: null
 n_layers: 4
 dropout: 0.2
 # einsum (BIT-reference path) | matmul (dense GEMM) | sparse (quasigroup gather).
 # sparse mirrors lgatr 2.0's sparse_gp=True default posture. "(fastest under compile on
 # GPU)" stood here and is FALSE as measured: β-PERF ran on 2026-08-12 and compiled it/s at
 # a shared batch is einsum 1.41 > matmul 1.36 > sparse 1.25, i.e. sparse is the SLOWEST of
 # the three by 12.8%, outside the 3% margin.
 #
 # NOT flipped to einsum on that alone, deliberately. The shared batch was sized EAGER,
 # where sparse peaks 0.59x einsum (47.6 vs 80.2 GB at bs 128) -- and einsum then OOM'd ten
 # steps into its own eager run at that batch. Compiled, each impl will size its own batch,
 # and jets/s at each impl's OWN batch is the question. Nobody has measured it.
 #   for i in einsum matmul sparse; do \
 #     python utils/find_lr.py -cn toptagging model=tag_cgenn \
 #     model.net.gp_impl=$i save=false +lr_find.find_batch_size=true; done
 # find_lr sizes on the SHIPPED (compiled) config and now prints jets/s per rung, so that
 # loop answers it directly. Flip this line if einsum still leads. docs/cgenn-compile.md
 #
 # ADOPTED: flash (2026-08-19, round-trips #7-#10, operator-ratified). The generated
 # Cl(1,3) Triton kernels with the tuned launch configs: 682 jets/s compiled @512 vs
 # sparse's best PROBE-SAFE config 345 @64 = 1.98x, own-best per arm, full fp32,
 # pre-registered >10% bar cleared. Sparse's shipped bs128+compile was found
 # probe-UNSAFE (worst-case batch OOM), so it was not a legal incumbent config.
 # Gates at this posture: flash battery 6/6, 100-step varying-shape soak 3/3 under
 # the tuned configs. KILL SWITCH: set sparse here (and top_cgenn.yaml back to
 # bs 128 / lr 5.57e-4 -- batch and lr move together). Full record:
 # docs/cgenn-compile.md round-trips #7-#10.
 gp_impl: flash

defaults:
 - framesnet: identity
