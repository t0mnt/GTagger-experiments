_target_: experiments.tagging.wrappers.CGENNWrapper
out_channels: null
compile: true  # torch.compile(net, dynamic=True); wrapper stays eager (docs/cgenn-compile.md; operator-adopted default)
activation_memory_budget: null  # OOM escape hatch only: fraction in (0,1] handed to
                                # AOT's partitioner, buying peak activation memory with
                                # backward recompute (lgatr 2.0's knob). null = torch
                                # default. Try the sparse gp_impl first -- it already
                                # cut retained activations 3.5x for free.

net:
 _target_: experiments.baselines.cgenn.cgenn.CGENN
 _partial_: true

 in_features_h: null
 hidden_features_h: 72
 in_features_x: 1
 hidden_features_x: 8
 decoder_features: 64
 n_outputs: null
 n_layers: 4
 dropout: 0.2
 # einsum (BIT-reference path) | matmul (dense GEMM) | sparse (quasigroup gather).
 # sparse mirrors lgatr 2.0's sparse_gp=True default posture (fastest under compile on
 # GPU); CPU-measured ranking is matmul > einsum > sparse, so quick/CPU work may prefer
 # matmul. β-PERF GPU matrix can overturn this with a one-line change. docs/cgenn-compile.md
 gp_impl: sparse

defaults:
 - framesnet: identity
