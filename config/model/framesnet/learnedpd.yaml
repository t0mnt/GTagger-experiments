# LLoCa's default frame, and upstream lloca-experiments ships this file verbatim.
# Lorentz invariance holds to ~5e-3 here in float64, against ~1e-6 for learnedso13:
# the polar decomposition divides by energy in the rest-frame boost, so a boost amplifies
# rounding through the per-edge transport. Exact in real arithmetic -- a numerical floor,
# not a broken symmetry (real breaks are O(0.1-1)). See tests/.../test_tag_equivariance.py
# FRAME_TOL, and note gamma is unregulated at gamma_max: null -- watch gamma_mean instead.
_target_: lloca.framesnet.equi_frames.LearnedPDFrames
is_global: false
random: false
fix_params: false
gamma_max: null
gamma_hardness: 10
deterministic_boost: null
compile: false
ortho_kwargs:
 use_float64: true
 method: gramschmidt
 eps_norm: 1e-15
 eps_reg: 1e-16
 eps_reg_lightlike: 1e-16
 checks: false

defaults:
 - equivectors: equimlp
