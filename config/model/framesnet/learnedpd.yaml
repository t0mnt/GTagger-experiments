# LLoCa's default frame, and upstream lloca-experiments ships this file verbatim.
# Lorentz invariance holds to ~5e-3 here in float64, against ~1e-6 for learnedso13.
# Cause, measured: NOT the division by energy (~1 ulp). gamma comes from `1 - beta^2`
# (lloca/utils/polar_decomposition.py:36), a catastrophic cancellation for relativistic
# inputs since 1-beta^2 ~ m^2/E^2 -- ~1e-12 median, ~1e-9 p99 on jet-like momenta, carried
# forward by rsqrt and the per-edge transport.
# NOT an implementation flaw: every algebraic route is equally conditioned (measured --
# E/m via E^2-|p|^2 gives 5.8e-13, via (E-|p|)(E+|p|) 8.0e-13, against lloca's 6.2e-13).
# Recovering a small mass from a large E and |p| is ill-conditioned, full stop; only
# carrying m instead of recovering it helps (3.9e-17), and a network-predicted vector has
# no carried mass. lloca already applies both available mitigations -- the float64 upcast
# in polar_decomposition and the lightlike/mass regularizers. learnedso13 escapes it by
# never building a rest frame at all, not by better arithmetic.
# gamma is unregulated at gamma_max: null (upstream's setting too) -- watch gamma_mean.
_target_: lloca.framesnet.equi_frames.LearnedPDFrames
is_global: false
random: false
fix_params: false
gamma_max: null
gamma_hardness: 10
deterministic_boost: null
compile: false
ortho_kwargs:
 use_float64: true
 method: gramschmidt
 eps_norm: 1e-15
 eps_reg: 1e-16
 eps_reg_lightlike: 1e-16
 checks: false

defaults:
 - equivectors: equimlp
