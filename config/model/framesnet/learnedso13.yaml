# Orthonormal SO(1,3) tetrad. MEASURED more invariant than the default learnedpd
# (~1e-6 vs ~5e-3 in float64, test_tag_equivariance.FRAME_TOL). WHY is not established:
# an earlier comment here said it 'never recovers a mass from (E,p)', and that is wrong --
# orthogonalize_4d normalises with lorentz_squarednorm (utils/orthogonalize_4d.py:131,138),
# the same E^2-|p|^2 cancellation. The likely reason is COMPOUNDING: pd runs three stages
# (form gamma by cancellation -> boost the references by that gamma~1e3 matrix ->
# orthogonalize the inflated result, polar_decomposition.py:102-109) where so13 runs one.
# Not isolated by measurement, so treat it as a hypothesis. pd is upstream's default and
# the parametrisation they trained on, so pd ships and this is the ablation. todo.md sec 3.
_target_: lloca.framesnet.equi_frames.LearnedSO13Frames
is_global: false
random: false
fix_params: false
compile: false
ortho_kwargs:
 use_float64: true
 method: gramschmidt
 eps_norm: 1e-15
 eps_reg_coplanar: 1e-16
 eps_reg_lightlike: 1e-16
 checks: false

defaults:
 - equivectors: equimlp
