# Orthonormal SO(1,3) tetrad. More numerically invariant than the default learnedpd
# (~1e-6 vs ~5e-3 in float64) because it never builds a rest frame, so it never recovers a
# mass from (E, p) and never hits that cancellation -- not because its arithmetic is better.
# No boost to regulate either. But pd is upstream's default and the parametrisation they
# trained on, so pd ships and this is the ablation. See todo.md section 3.
_target_: lloca.framesnet.equi_frames.LearnedSO13Frames
is_global: false
random: false
fix_params: false
compile: false
ortho_kwargs:
 use_float64: true
 method: gramschmidt
 eps_norm: 1e-15
 eps_reg_coplanar: 1e-16
 eps_reg_lightlike: 1e-16
 checks: false

defaults:
 - equivectors: equimlp
