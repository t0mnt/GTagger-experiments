_target_: experiments.tagging.wrappers.LGATrWrapper
mean_aggregation: false
out_channels: null
use_amp: false
attention_backend: xformers

net:
 _target_: lgatr.LGATr
 _partial_: true

 in_mv_channels: 1
 in_s_channels: null
 out_mv_channels: null
 out_s_channels: null
 hidden_mv_channels: 16
 hidden_s_channels: 32

 num_blocks: 12
 attention:
  num_heads: 8
  multi_query: false
  attn_ratio: 2
  head_scale: true
 mlp:
  nonlinearity: gelu
  mlp_ratio: 2
 # net-level compile, upstream tagging-guide practice (their tag_lgatr ships exactly this);
 # operator-adopted default -- supersedes the earlier Gate-H parking (docs/cgenn-compile.md).
 # NOT covered by test_compile_true_is_backward_verified, which scopes itself to the
 # WRAPPER knob (see its docstring). Measured instead, from this config with no overrides:
 # dynamo 2 frames / 2 ok, inductor 4 entries, backward 405/405 finite gradients; and 8
 # real optimizer steps at 100% nonzero-grad via
 #   CGENN_SMOKE_COMPILE=1 pytest tests/experiments/test_training_smoke.py -k tag_lgatr
 compile: true
 compile_kwargs:
  dynamic: true

defaults:
 - framesnet: identity
