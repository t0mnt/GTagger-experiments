_target_: experiments.tagging.wrappers.ParTWrapper
in_channels: null
out_channels: null
use_amp: false
add_fourmomenta_backbone: false
compile: false                  # TRAIN-MODE SEMANTICS: the compile knob flips the PairEmbed to the
                                # all-pairs twin (tril/nonzero are untraceable), so the pair BatchNorm
                                # sees the padded PxP grid instead of real pairs only -- measured train
                                # divergence 6.8e-01 outputs, 15.0 BN buffers, and BN running buffers are persistent
                                # state that would carry into checkpoints. Eval is exact (<=4e-15, TOL-gated).
                                # Pinned by test_nonequi_compile.test_train_mode_differential, which also
                                # asserts this key stays false. Revisit only with a masked pair-BN
                                # (todo 4b-quater) -- not with a bare flip.

net:
 _target_: experiments.baselines.particletransformer.ParticleTransformer
 _partial_: true
 input_dim: null
 num_classes: null

 attn_reps: 8x0n+2x1n
 num_layers: 8
 num_cls_layers: 2
 num_heads: 8
 embed_dims: [128,512,128]
 pair_embed_dims: [64,64,64]

 use_amp: ${model.use_amp}
 trim: true

 use_pre_activation_pair: false
 pair_input_dim: 4
 cls_block_params:
  dropout: 0
  attn_dropout: 0
  activation_dropout: 0
 version: 1

defaults:
 - framesnet: identity
