_target_: experiments.tagging.wrappers.CGENNLGATrGraphTransWrapper
out_channels: null              # init_physics -> num_outputs 
# no use_amp key: this wrapper has no autocast and does not accept one; the
# GradScaler still reads cfg.model.use_amp, which defaults to False.
compile: true  # torch.compile(net, dynamic=True); edges hoisted eager (operator-adopted default)
activation_memory_budget: null  # OOM escape hatch only: fraction in (0,1] handed to
                                # AOT's partitioner, buying peak activation memory with
                                # backward recompute (lgatr 2.0's knob). null = torch
                                # default. NOTE the sparse gp_impl does NOT relieve this
                                # under compile: AOT's partitioner equalizes retention
                                # across all three impls (its 3.5x is eager-only --
                                # docs/cgenn-compile.md, CORRECTION).

net:
  _target_: experiments.baselines.CGENNLGATrGraphTransHybrid.CGENNLGATrGraphTrans
  _partial_: true
  in_s_channels: null          #should be 
  # num_classes is supplied by the wrapper at call time (= out_channels)

  hidden_mv_channels: 16
  hidden_s_channels: 32
  num_blocks: 10
  num_heads: 8
  head_scale: true
  checkpoint_blocks: false

  k: 16
  cgenn_layers: 3
  cgenn_hidden_h: 72
  cgenn_hidden_x: 8             # match official CGENN (tag_cgenn hidden_features_x=8); mv-bridge lifts 8->16
  # einsum (BIT-reference) | matmul | sparse | flash. ADOPTED flash 2026-08-21
  # (operator ruling): post-alignment-fix A/B at own-best batches -- eager 531@512,
  # compiled 849@1024 jets/s; flash gates 6/6 + 100-step varying-shape soak green;
  # accuracy is TOL-class vs sparse (kernel parity 3e-16, model bars in
  # test_cgenn_compile) with the tag_cgenn revalidation as the kernel family's
  # train-to-convergence leg. No sparse-timed control row existed for this model
  # (see bperf_results.md for the recorded arms); adoption rests on the tag_cgenn
  # race transfer + the memory ceiling lift (512 -> 1024). KILL SWITCH: sparse +
  # training batchsize 512 restore TOGETHER.
  gp_impl: flash
  cgenn_aggregation: mean
  cgenn_residual: false           # match official CGENN top-tagging (LorentzCGGNN default) and the tag_cgenn reference row
  cgenn_layer_type: fc
  cgenn_normalization_init: null  # match official CGENN top-tagging (LorentzCGGNN default: no NormalizationLayer) and the tag_cgenn reference row
  concat_original: true
  use_explicit_edge_features: true

  beam_spurion: xyplane
  add_time_spurion: true
  beam_mirror: true
  knn_metric: deltaR            # 'deltaR' (eta-phi L2) or 'minkowski' (4-momenta).
                                # deltaR pinned 2026-08-21 to match the other six
                                # hybrids: the A/B put it ahead on 5 of 7 models and
                                # the trained LN-hybrid rows read 0.9412 deltaR vs
                                # 0.9398 minkowski (~7sd on their seed spread). The
                                # BIT pins replay minkowski explicitly, so they stand.

defaults:
  - framesnet: identity
