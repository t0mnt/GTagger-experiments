_target_: experiments.tagging.wrappers.PlainGraphTransWrapper
in_channels: null               # init_physics -> 7 + extra_scalars
out_channels: null              # init_physics -> num_outputs
use_amp: false
add_fourmomenta_backbone: false
compile: false                  # CRASHES ON BACKWARD under the shipped dynamic=True: inductor cannot
                                # order strides of a symbolically-shaped tensor and raises InductorError
                                # (1 < Min(4, Max(1, s98 - 1))) at the first loss.backward(). Forward-only
                                # compile is fine, which is why every eval/no_grad gate passed it. Pinned by
                                # test_nonequi_compile.test_compile_true_is_backward_verified.
                                #
                                # DIAGNOSED 2026-08-10, and it IS fixable -- recorded so nobody re-derives it:
                                #   * cause is the kNN k-cap `k = min(k, max(1, num_points - 1))` (knn(),
                                #     this file). Proven by substitution: with the cap removed so k stays a
                                #     python int, the model compiles AND backwards (71/71 grads). The same
                                #     cap line also exists in particlenettransformer.py and
                                #     lorentznetlgatrslimgraphtrans.py, which compile FINE -- the cap is
                                #     necessary, not sufficient; what differs is that here the k-shaped
                                #     tensor reaches a site where inductor must order strides.
                                #   * a pad-then-topk variant (pad the distance matrix to >= k+1 columns
                                #     with -inf, keep k a python constant) also compiles + backwards, and
                                #     preserves the safety property the cap exists for.
                                #   * the cap NEVER BINDS in production: measured padded P per batch is
                                #     87-110 at batchsize 128/256 against knn_k: 16, i.e. 0/15 batches.
                                #     It only binds in tiny-batch regimes -- including the gates' own
                                #     batchsize 4, which is why BIT would fail on a naive change.
                                # => a real fix is a COMPILE-ONLY twin (eager untouched, like
                                # PairEmbed.compiled_dense), with fixtures + gates. Post-merge work, not a
                                # knob flip. NOTE the sibling crasher tag_LorentzNetLGATrSlimGraphGPS has a
                                # DIFFERENT cause (that file has no k-cap at all), so this does not fix it.

net:
  _target_: experiments.baselines.plaingraphtrans.PlainGraphTrans
  _partial_: true
  input_dim: null               # supplied by the wrapper (= in_channels)
  num_classes: null             # supplied by the wrapper (= out_channels)

  # static plain-MPNN graph backbone (3 GNN blocks) with LLoCa tensorial message-passing.
  # hidden_reps_list types each MPNN block's input for the neighbour frame transport: block 0
  # is null (pure scalars = input_dim, set by the wrapper), deeper blocks carry vectors (Nx1n)
  # so geometry is communicated between frames. Each rep's dim must equal the block's input
  # width (here gnn_dims[0]=128, gnn_dims[1]=128). Purely additive -> a no-op under identity
  # frames (bit-identical to the plain backbone).
  gnn_dims: [128, 128, 128]
  hidden_reps_list: [null, "64x0n+16x1n", "64x0n+16x1n"]
  knn_k: 16
  knn_metric: deltaR            # 'deltaR' (eta-phi L2) or 'minkowski' (4-momenta)
  use_fts_bn: true
  use_input_concat: true

  # plain transformer encoder (torch nn.MultiheadAttention) with LLoCa tensorial attention.
  # attn_reps is the per-head tensor representation; the transformer width is
  # embed_dim = attn_reps.dim * num_heads (here (8 + 2*4) * 8 = 128). It must carry >=1
  # vector (Nx1n) for the q/k/v frame transport to communicate geometric information.
  embed_dim: 128
  attn_reps: "8x0n+2x1n"
  num_layers: 10
  num_heads: 8
  ffn_ratio: 4
  dropout: 0.1
  activation: gelu
  fc_params: []

  for_inference: false

defaults:
  - framesnet: identity
