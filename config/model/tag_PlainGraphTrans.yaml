_target_: experiments.tagging.wrappers.PlainGraphTransWrapper
in_channels: null               # init_physics -> 7 + extra_scalars
out_channels: null              # init_physics -> num_outputs
use_amp: false
add_fourmomenta_backbone: false
compile: true                   # torch.compile(net, dynamic=True). Routes the kNN through the
                                # static-k twin (`compiled_knn`, see knn() in plaingraphtrans.py):
                                # the eager cap `min(k, max(1, num_points - 1))` makes k a SYMBOLIC
                                # expression, and inductor cannot order the strides of the topk output
                                # carrying it -- InductorError at the first loss.backward(). The twin
                                # keeps k a python int, which is EQUAL to eager (not merely close)
                                # whenever num_points - 1 >= k, and it raises rather than diverging
                                # otherwise. Measured: production padded P is 87-110 per batch at
                                # batchsize 128/256 against knn_k: 16 -- 0/15 batches bind the cap.
                                # Gates: BIT eager unchanged (fp32+fp64), train-mode differential
                                # 0.000e+00, TOL 1.1e-16, BREAKS 0, RECOMP [1,1,1], compiled backward
                                # 71/71 nonzero finite grads. Eager path untouched (static_k defaults
                                # False), so this is a compile-only twin like PairEmbed.compiled_dense.

net:
  _target_: experiments.baselines.plaingraphtrans.PlainGraphTrans
  _partial_: true
  input_dim: null               # supplied by the wrapper (= in_channels)
  num_classes: null             # supplied by the wrapper (= out_channels)

  # static plain-MPNN graph backbone (3 GNN blocks) with LLoCa tensorial message-passing.
  # hidden_reps_list types each MPNN block's input for the neighbour frame transport: block 0
  # is null (pure scalars = input_dim, set by the wrapper), deeper blocks carry vectors (Nx1n)
  # so geometry is communicated between frames. Each rep's dim must equal the block's input
  # width (here gnn_dims[0]=128, gnn_dims[1]=128). Purely additive -> a no-op under identity
  # frames (bit-identical to the plain backbone).
  gnn_dims: [128, 128, 128]
  hidden_reps_list: [null, "64x0n+16x1n", "64x0n+16x1n"]
  knn_k: 16
  knn_metric: deltaR            # 'deltaR' (eta-phi L2) or 'minkowski' (4-momenta)
  use_fts_bn: true
  use_input_concat: true

  # plain transformer encoder (torch nn.MultiheadAttention) with LLoCa tensorial attention.
  # attn_reps is the per-head tensor representation; the transformer width is
  # embed_dim = attn_reps.dim * num_heads (here (8 + 2*4) * 8 = 128). It must carry >=1
  # vector (Nx1n) for the q/k/v frame transport to communicate geometric information.
  embed_dim: 128
  attn_reps: "8x0n+2x1n"
  num_layers: 10
  num_heads: 8
  ffn_ratio: 4
  dropout: 0.1
  activation: gelu
  fc_params: []

  for_inference: false

defaults:
  - framesnet: identity
