_target_: experiments.tagging.wrappers.LorentzNetLGATrSlimGraphGPSWrapper
out_channels: null              # init_physics -> num_outputs
compile: false                  # CANNOT BE LOWERED under the shipped dynamic=True: inductor cannot
                                # order strides of a symbolically-shaped tensor (1 < s53) and raises
                                # InductorError while compiling the joint forward+backward graph.
                                # Forward-only compile is fine, which is why every eval/no_grad gate
                                # passed it. Pinned by
                                # test_nonequi_compile.test_compile_true_is_backward_verified.
                                #
                                # NOT a NaN and NOT a numerics problem -- stated explicitly because the
                                # two get conflated. It is a compile-time raise; eager is untouched and
                                # is what ships. Measured under dynamic=False (which DOES lower it):
                                # 5 optimizer steps, 65/65 gradients, ZERO non-finite tensors,
                                # loss 0.7101 -> 0.7115. The math is fine; only the lowering fails.
                                #
                                # ROOT CAUSE, localized 2026-08-10 by instrumenting inductor's
                                # GraphLowering.run_node. The failing node was aten.permute at
                                # lorentznetlgatrslimgraphgps.py:109 (`v_loc.transpose(-1, -2)`) on a
                                # tensor of shape (B, P, 4, V) with strides (16*P, 16, 1, 4). To order
                                # those strides inductor must decide `1 < P`, and nothing constrains the
                                # particle dim away from 0/1. It is the M8 CHANNEL-LAST 4-D LAYOUT
                                # meeting a symbolic particle dim -- not any single line.
                                #
                                # FOUR NEGATIVE RESULTS, so the next attempt starts here:
                                #  1. NOT the kNN k-cap. (Correcting an earlier note in this file: this
                                #     module DOES reach a capped knn -- it imports it from
                                #     lorentznetlgatrslimgraphtrans -- so "no k-cap here" was wrong. But
                                #     substituting the static-k twin that fixed tag_PlainGraphTrans
                                #     changes NOTHING here: same error, same symbol.)
                                #  2. `.contiguous()` on all three M8 transposes: same error.
                                #  3. flatten(0,1) -> transpose(1,2) -> reshape, so the transpose sees
                                #     only STATIC dims: the permute then succeeds (strides 16,4,1) and
                                #     the error MOVES to the reshape rebuilding (B, P, 4, V). Confirms
                                #     the layout, not the op, is the problem.
                                #  4. torch._check(P > 1) at the top of forward: no effect.
                                #     torch._dynamo.mark_dynamic(t, dim, min=2) at the wrapper boundary:
                                #     rejected by this torch (2.13) -- "not simple sympy type".
                                #
                                # THE LEVER that would work is making `P >= 2` known to the ShapeEnv, so
                                # `1 < P` becomes decidable. Neither available API landed it here; the
                                # next things to try are a torch upgrade or export-style Dim(min=2)
                                # constraints. Until then: bounded walltime gain on a model that is
                                # already correct in eager, so it stays false and is the single
                                # remaining bperf NO_APPLY entry.

net:
  _target_: experiments.baselines.lorentznetlgatrslimgraphgps.LorentzNetLGATrSlimGraphGPS
  _partial_: true
  in_s_channels: null           # init_physics -> extra_scalars + tagging features
  # num_classes is supplied by the wrapper at call time (= out_channels)

  # dual-stream hidden widths -- option A: one shared dim_h for the GNN + attention (as in the
  # official GraphGPS). Set to the slim transformer's widths (tag_slim 96/32); the LorentzNet GNN
  # rides this shared width too. (Towards-transformer; a midpoint ~84/24 is the alternative.)
  hidden_v_channels: 32
  hidden_s_channels: 96

  # interleaved equivariant GPS layers (LorentzNet edge conv local + slim attn global)
  num_blocks: 10
  num_heads: 8
  attn_ratio: 1
  mlp_ratio: 4                  # slim's mlp_ratio (tag_slim); lgatr lib default is 2
  num_layers_mlp: 2
  nonlinearity: gelu
  # dropout_prob = the external GraphGPS branch dropout (grade-aware, on branch outputs).
  # attn_dropout = dropout on the attention WEIGHTS, threaded as sdpa dropout_p through
  # lgatr's single joint (mv,s) attention call -- the same site as the non-equivariant
  # models' attn_dropout, so the family dropout ablation is one axis. 0.0 = exact no-op
  # (kwarg omitted; keeps non-sdpa attention backends working). Weights are Lorentz
  # invariants, so this preserves equivariance.
  dropout_prob: null
  attn_dropout: 0.0

  # static kNN graph + per-layer LorentzNet edge conv
  knn_k: 16
  knn_metric: minkowski         # 'minkowski' (Lorentz-invariant) or 'deltaR' (eta-phi L2)
  c_weight: 5e-3
  use_phi_m: true               # LorentzNet per-edge gate
  use_node_attr: true           # official LorentzNet: raw input scalars re-injected into phi_h every layer

  # input-stage spurions (both on -> residual symmetry SO(2) about the beam)
  add_time_spurion: true
  beam_spurion: true

  head_layers: 2

defaults:
  - framesnet: identity
