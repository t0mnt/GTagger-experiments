_target_: experiments.tagging.wrappers.LorentzNetLGATrSlimGraphGPSWrapper
out_channels: null              # init_physics -> num_outputs
compile: false                  # UPSTREAM TORCH BUG, root-caused 2026-08-10 -- not a defect in this
                                # model and NOT fixable from model code. Eager ships and is correct.
                                #
                                # WHAT HAPPENS: inductor lowers the joint forward+backward graph and
                                # must pick a memory layout for the (B, P, 4, V) multivector stream,
                                # whose strides are (16*P, 16, 1, 4). Ordering them means asking
                                # "is 16*P bigger than 16?", i.e. "is P > 1?". P is the padded particle
                                # count -- a symbol, not a number -- so it raises
                                #   InductorError: cannot determine truth value of Relational: 1 < s53
                                #
                                # WHY IT IS TORCH'S BUG, not ours. ir.get_fill_order already has a
                                # symbolic-aware branch:
                                #     if shape_env is None ...: argsort(seq)          # bare compare
                                #     else:                     argsort_sym(shape_env, seq)   # handles symbols
                                # but torch/_inductor/graph.py calls `ir.get_stride_order(strides)` with
                                # ONE argument, so shape_env is None and it takes the bare-compare branch.
                                # Nothing ever consults the ShapeEnv, which is why constraining P does
                                # not help. PROVEN: monkeypatching get_stride_order to pass the live
                                # V.graph.sizevars.shape_env makes this model compile AND train --
                                # 3 steps, 65/65 gradients, zero non-finite, losses 0.710076 / 0.712327 /
                                # 0.709093, bit-matching the dynamic=False run. One-line upstream fix.
                                #
                                # WHY THIS MODEL AND NOT ITS PARENTS OR ITS SIBLING: only GPS converts
                                # layouts. tag_lorentznet and tag_slim each stay in their own convention;
                                # so does tag_LorentzNetLGATrSlimGraphTrans, which runs the LorentzNet
                                # stack and THEN the slim stack (zero `transpose(-1,-2)` in that file).
                                # A GPS layer fuses local and global branches on ONE stream per layer, so
                                # it must cross between channel-first LorentzNet and channel-last v2 slim
                                # (M8) twice per layer -- that 4-D transpose is the node that dies.
                                #
                                # ATTEMPTS THAT DO NOT WORK (all model-side, all futile for the reason
                                # above -- do not repeat):
                                #   1. the static-k kNN twin that fixed tag_PlainGraphTrans. (NB this
                                #      module DOES reach a capped knn, imported from
                                #      lorentznetlgatrslimgraphtrans -- an earlier note here wrongly said
                                #      it had none -- but making k static changes nothing.)
                                #   2. .contiguous() on all three M8 transposes.
                                #   3. flatten(0,1) -> transpose(1,2) -> reshape: the permute then
                                #      succeeds and the error MOVES to the reshape rebuilding (B,P,4,V).
                                #   4. torch._check(P > 1), and mark_dynamic(dim, min=2, max=4096) at the
                                #      wrapper boundary -- the mark applies (the symbol renumbers) and the
                                #      error is unchanged, exactly as the shape_env analysis predicts.
                                #
                                # TO RE-TRY AFTER A TORCH UPGRADE: check whether _inductor/graph.py now
                                # passes a shape_env into get_stride_order. If it does, flip this to true
                                # and run the normal gate battery. Do NOT ship the monkeypatch: patching
                                # torch internals under a physics campaign is not worth a bounded
                                # walltime gain on a model that is already correct in eager.

net:
  _target_: experiments.baselines.lorentznetlgatrslimgraphgps.LorentzNetLGATrSlimGraphGPS
  _partial_: true
  in_s_channels: null           # init_physics -> extra_scalars + tagging features
  # num_classes is supplied by the wrapper at call time (= out_channels)

  # dual-stream hidden widths -- option A: one shared dim_h for the GNN + attention (as in the
  # official GraphGPS). Set to the slim transformer's widths (tag_slim 96/32); the LorentzNet GNN
  # rides this shared width too. (Towards-transformer; a midpoint ~84/24 is the alternative.)
  hidden_v_channels: 32
  hidden_s_channels: 96

  # interleaved equivariant GPS layers (LorentzNet edge conv local + slim attn global)
  num_blocks: 10
  num_heads: 8
  attn_ratio: 1
  mlp_ratio: 4                  # slim's mlp_ratio (tag_slim); lgatr lib default is 2
  num_layers_mlp: 2
  nonlinearity: gelu
  # dropout_prob = the external GraphGPS branch dropout (grade-aware, on branch outputs).
  # attn_dropout = dropout on the attention WEIGHTS, threaded as sdpa dropout_p through
  # lgatr's single joint (mv,s) attention call -- the same site as the non-equivariant
  # models' attn_dropout, so the family dropout ablation is one axis. 0.0 = exact no-op
  # (kwarg omitted; keeps non-sdpa attention backends working). Weights are Lorentz
  # invariants, so this preserves equivariance.
  dropout_prob: null
  attn_dropout: 0.0

  # static kNN graph + per-layer LorentzNet edge conv
  knn_k: 16
  knn_metric: minkowski         # 'minkowski' (Lorentz-invariant) or 'deltaR' (eta-phi L2)
  c_weight: 5e-3
  use_phi_m: true               # LorentzNet per-edge gate
  use_node_attr: true           # official LorentzNet: raw input scalars re-injected into phi_h every layer

  # input-stage spurions (both on -> residual symmetry SO(2) about the beam)
  add_time_spurion: true
  beam_spurion: true

  head_layers: 2

defaults:
  - framesnet: identity
