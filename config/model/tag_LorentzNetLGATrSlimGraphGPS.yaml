_target_: experiments.tagging.wrappers.LorentzNetLGATrSlimGraphGPSWrapper
out_channels: null              # init_physics -> num_outputs
# no use_amp key: this wrapper has no autocast and does not accept one; the
# GradScaler still reads cfg.model.use_amp, which defaults to False.
compile: true                   # torch.compile(net, dynamic=True), enabled by a SCOPED
                                # torch._functorch.config.patch(recompute_views=True) around the net
                                # call (LorentzNetLGATrSlimGraphGPSWrapper.forward).
                                #
                                # Why it was needed: a GPS layer fuses its local and global branches on
                                # ONE stream, so it crosses between channel-first LorentzNet and
                                # channel-last v2 slim (M8) twice per layer. AOT's partitioner saves that
                                # transpose across the fwd/bwd boundary because views are cheap to save,
                                # and inductor's stride-ordering for graph outputs THAT ARE VIEWS then has
                                # to compare strides (16*P, 16, 1, 4) -- i.e. ask "is P > 1?" -- through a
                                # code path that is never handed the ShapeEnv. With a symbolic P that
                                # raises InductorError "cannot determine truth value of Relational: 1 < s53"
                                # while lowering the JOINT graph. Forward-only compile was always fine,
                                # which is why every eval/no_grad gate passed it.
                                # recompute_views=True makes the backward RECOMPUTE the view instead of
                                # saving it, so it is no longer a graph output and the path is never
                                # entered. Numerics-preserving by construction, and measured so.
                                #
                                # Neither parent needs this and neither does the GraphTrans sibling:
                                # tag_lorentznet and tag_slim each stay in one convention, and
                                # tag_LorentzNetLGATrSlimGraphTrans runs the stacks SEQUENTIALLY (zero
                                # `transpose(-1,-2)` in that file). The cost is the GPS topology itself.
                                #
                                # Measured (caches force-disabled, so no stale artifact):
                                #   compiled-vs-eager  0.000e+00 in EVAL and 0.000e+00 in TRAIN
                                #   BREAKS 0, RECOMP [1, 1, 1], TOL 0.000e+00
                                #   3 optimizer steps: 65/65 gradients, zero non-finite
                                # The patch is scoped to this wrapper's forward, NOT set globally, because
                                # the training smoke and the FLOPs harness build many models per process.

net:
  _target_: experiments.baselines.lorentznetlgatrslimgraphgps.LorentzNetLGATrSlimGraphGPS
  _partial_: true
  in_s_channels: null           # init_physics -> extra_scalars + tagging features
  # num_classes is supplied by the wrapper at call time (= out_channels)

  # dual-stream hidden widths -- option A: one shared dim_h for the GNN + attention (as in the
  # official GraphGPS). Set to the slim transformer's widths (tag_slim 96/32); the LorentzNet GNN
  # rides this shared width too. (Towards-transformer; a midpoint ~84/24 is the alternative.)
  hidden_v_channels: 32
  hidden_s_channels: 96

  # interleaved equivariant GPS layers (LorentzNet edge conv local + slim attn global)
  num_blocks: 10
  num_heads: 8
  attn_ratio: 1
  mlp_ratio: 4                  # slim's mlp_ratio (tag_slim); lgatr lib default is 2
  num_layers_mlp: 2
  nonlinearity: gelu
  # dropout_prob = the external GraphGPS branch dropout (grade-aware, on branch outputs).
  # attn_dropout = dropout on the attention WEIGHTS, threaded as sdpa dropout_p through
  # lgatr's single joint (mv,s) attention call -- the same site as the non-equivariant
  # models' attn_dropout. 0.0 = exact no-op
  # (kwarg omitted; keeps non-sdpa attention backends working). Weights are Lorentz
  # invariants, so this preserves equivariance.
  dropout_prob: null
  attn_dropout: 0.0  # KEEP 0. Measured, not inherited: GraphGPS's own 0.5 costs
                     # Plain-GPS -0.0049 accuracy and a third of both rejections on
                     # top tagging (docs/ablations.md, "Capacity and shape").

  # static kNN graph + per-layer LorentzNet edge conv
  knn_k: 16
  # deltaR, matching what the TRAINED table rows actually ran: the jc row's saved
  # run config (runs/jc_debug/LorentzNetLGATrSlimGraphTrans_8864/config_0.yaml,
  # verified 2026-08-21) says deltaR while this yaml said minkowski -- a rerun
  # would have silently changed the graph. deltaR is also every sibling model's
  # default (particlenet/pnt/plaingraphgps/pnpart-gps). minkowski remains the
  # documented Lorentz-invariant alternative; the metric x k sweep is an open
  # ablations item (docs/ablations.md). If re-running a TOP row, check its run
  # dir's config the same way before assuming either value.
  knn_metric: deltaR
  c_weight: 5e-3
  use_phi_m: true               # LorentzNet per-edge gate
  use_node_attr: true           # official LorentzNet: raw input scalars re-injected into phi_h every layer

  # input-stage spurions (both on -> residual symmetry SO(2) about the beam)
  add_time_spurion: true
  beam_spurion: true

  head_layers: 2

defaults:
  - framesnet: identity
