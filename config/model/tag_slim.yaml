_target_: experiments.tagging.wrappers.LGATrSlimWrapper
mean_aggregation: false
out_channels: null
use_amp: false
attention_backend: xformers

net:
 _target_: lgatr.LGATrSlim
 _partial_: true

 in_v_channels: 1
 in_s_channels: null
 out_v_channels: 0
 out_s_channels: null
 hidden_v_channels: 32
 hidden_s_channels: 96

 num_blocks: 12
 num_heads: 8
 mlp_ratio: 4
 attn_ratio: 1
 compile: true
 compile_kwargs:
  dynamic: true  # M9: v1.4.4 forced compile_dynamic=True; v2's compile_kwargs default {} means
                 # dynamic=None = torch AUTOMATIC (static first graph, dynamic re-trace on the
                 # 2nd distinct shape) -- not "off", but it still burns one throwaway static
                 # graph per code path; pinning true skips that and matches the v1 posture

defaults:
 - framesnet: identity
