# JetClass training recipe for tag_PlainGraphGPS -- fill in the (???) keys, then:
#   python run.py -cn jctagging model=tag_PlainGraphGPS training=jc_PlainGraphGPS gpus=1
#
#   lr         <- utils/find_lr.py -cn jctagging model=tag_PlainGraphGPS         (reported loss-min / 10)
#   batchsize  <- utils/find_lr.py -cn jctagging ... +lr_find.find_batch_size=true
#   (epochs=5 + CosineAnnealingWarmup + weight_decay=0 are shared in jc_gts_and_friends_default)
#
# Re-sweep BOTH knobs on the jctagging task rather than copying the top_PlainGraphGPS values:
# JetClass inputs are wider (7+10 scalar channels), so the memory ceiling and the
# loss-vs-lr curve both move. NOTE: '???' is a human-facing marker only -- left
# unfilled, the recipe silently runs at the inherited tag_default 512 / 1e-3.
defaults:
  - jc_gts_and_friends_default

# found using utils/find_lr.py (batch size capped at <=512)
# batchsize 512 <- utils/find_bs.py --task jctagging (H100, 2026-08-18: all three
# GPS rows fit 512, peaks 17.8/46.9/47.2 GB; 1024 OOM)
batchsize: 512
