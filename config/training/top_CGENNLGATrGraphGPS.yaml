# Training recipe for tag_CGENNLGATrGraphGPS -- fill the UNSWEPT keys, then:
#   python run.py model=tag_CGENNLGATrGraphGPS training=top_CGENNLGATrGraphGPS data.dataset=full gpus=1
#
#   lr         <- find_lr.py                                   (reported loss-min / 10)
#   batchsize  <- find_lr.py +lr_find.find_batch_size=true     (the GPU-fit size)
#   (epochs=20 + CosineAnnealingWarmup are shared in tag_gts_and_friends_default; iterations auto-derived)
#   weight_decay (optional override) -> see the weight-decay guidance
#
# Inherits tag_gts_and_friends_default: AdamW, CosineAnnealingWarmup, epochs=20, grad-clip 1.0, best-val checkpoint.
defaults:
  - tag_gts_and_friends_default

# lr/batchsize below are the tag_default family fallback and count as UNSWEPT --
# replace them with your find_lr results before a real campaign. (A '???' here is
# silently inert: OmegaConf MISSING never overrides a value inherited from
# tag_default, so the recipe would run at the fallback without complaint.)
batchsize: 512   # UNSWEPT fallback -- replace with find_lr's find_batch_size result
lr: 1.0e-3       # UNSWEPT fallback -- replace with find_lr's loss-min/10

# weight_decay: 0.01          # AdamW: tune on val {0, 0.01, 0.05, 0.1}
# optimizer: AdamW            # AdamW | Ranger | Lion | ...
# scheduler: OneCycleLR        # override the shared CosineAnnealingWarmup here if wanted
