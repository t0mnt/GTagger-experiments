# Training recipe for tag_CGENNLGATrGraphTrans -- fill in the (???) keys, then:
#   python run.py model=tag_CGENNLGATrGraphTrans training=top_CGENNLGATrGraphTrans data.dataset=full gpus=1
#
#   lr         = 1e-3 TABLE-WIDE (2026-08-16 operator decision; see the note at the key)
#   batchsize  <- utils/find_bs.py (bs only, quick) or find_lr.py +lr_find.find_batch_size=true
#   (epochs=20 + CosineAnnealingWarmup are shared in tag_gts_and_friends_default; iterations auto-derived)
#   weight_decay (optional override) -> see the weight-decay guidance
#
# Inherits tag_gts_and_friends_default: AdamW, CosineAnnealingWarmup, epochs=20, grad-clip 1.0, best-val checkpoint.
# NOTE: `???` is NOT enforced by hydra -- the shared default would silently supply
# batchsize 512 / lr 1e-3. run.py refuses to launch an unswept recipe instead
# (_check_recipe_is_swept); pass `training.<key>=<value>` if you mean to override.
defaults:
  - tag_gts_and_friends_default

# lr: TABLE-WIDE 1e-3 (2026-08-16 operator decision). Two finder-transcription incidents
# (docs/cgenn-compile.md, 'find_lr incident' parts 1-3) retired per-row finder lrs for this
# campaign: reliable hybrid readings cluster 4.5e-4..1.2e-3, all rows share the AdamW
# recipe, and 1e-3 is trained-and-validated on PNPT (0.9414 vs weaver 0.9417, inside seed
# spread). The finder stays as the CONFIRMATION tool; batch size cap stays <=512 (update
# starvation under the epoch budget).
# 512, NOT the 1024 the flash probe fits (bperf --find-batchsize, H100 2026-08-21).
# The probe answers "what fits", not "what to train at": the table-wide cap above is
# <=512 precisely because of update starvation under the EPOCH budget, and 1024 would
# give this row 23660 optimizer steps against every other hybrid's 47320 -- half the
# updates, same data exposure. That asymmetry is the thing the cap exists to prevent,
# and it is not worth the ~6-12% throughput the larger batch buys (flash-compiled
# measured 849 jets/s @1024; @512 is the same basin, one rung down). lr 1e-3 is the
# TABLE-WIDE value and is validated AT 512, so this pairing needs no re-derivation --
# which 1024 would have (sqrt-map -> ~1.4e-3, unswept). Operator decision 2026-08-21.
batchsize: 512
lr: 1e-3

# weight_decay: 0.01          # AdamW: tune on val {0, 0.01, 0.05, 0.1}
# optimizer: AdamW            # AdamW | Ranger | Lion | ...
# scheduler: OneCycleLR        # override the shared CosineAnnealingWarmup here if wanted
