# TopTagXL training recipe for tag_ParticleNetParTGraphGPS -- batchsize/lr carried from
# jc_ParticleNetParTGraphGPS (see below). Run:
#   python run.py -cp config -cn toptagxl model=tag_ParticleNetParTGraphGPS training=xl_ParticleNetParTGraphGPS gpus=1
#
#   (epochs=5 + CosineAnnealingWarmup + weight_decay=0 are shared in xl_gts_and_friends_default)
#   To re-sweep after a model change:
#   lr         <- utils/find_lr.py -cn toptagxl model=tag_ParticleNetParTGraphGPS         (reported loss-min / 10)
#   batchsize  <- utils/find_lr.py -cn toptagxl ... +lr_find.find_batch_size=true
#
# Both knobs are the swept jc_ParticleNetParTGraphGPS values, unchanged: TopTagXL inputs
# are identical to JetClass (7+10 scalar channels, same multiplicity), so the batch-size
# memory ceiling transfers as is, and the lr is the 2026-08-16 table-wide decision
# (1e-3 AdamW) the jc family carries -- lr scale is set by optimizer + batch +
# architecture, not by the dataset, and only the loss changed (binary sigmoid vs
# 10-class softmax; upstream itself runs XL under the JetClass recipe). NOTE: a bare
# '???' here would be a human-facing marker only -- the recipe would silently run at the
# inherited tag_default 512 / 1e-3, which is why run.py::_check_recipe_is_swept refuses
# to launch one.
defaults:
  - xl_gts_and_friends_default

# batchsize 512 = jc_ParticleNetParTGraphGPS (utils/find_bs.py --task jctagging, H100,
# 2026-08-18: all three GPS rows fit 512 on the same 17-channel inputs, peaks
# 17.8/46.9/47.2 GB; 1024 OOM)
batchsize: 512
# lr: carried from the 2026-08-16 top-tagging table-wide decision (1e-3 AdamW,
# validated on PNPT 0.9414 vs weaver 0.9417) -- the same convention as the jc hybrid
# recipes.
lr: 1e-3
