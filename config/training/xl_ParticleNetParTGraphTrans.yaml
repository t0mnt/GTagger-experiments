# TopTagXL training recipe for tag_ParticleNetParTGraphTrans -- batchsize/lr carried from
# jc_ParticleNetParTGraphTrans (see below). Run:
#   python run.py -cp config -cn toptagxl model=tag_ParticleNetParTGraphTrans training=xl_ParticleNetParTGraphTrans gpus=1
#
#   (epochs=5 + CosineAnnealingWarmup + weight_decay=0 are shared in xl_gts_and_friends_default)
#   To re-sweep after a model change:
#   lr         <- utils/find_lr.py -cn toptagxl model=tag_ParticleNetParTGraphTrans         (reported loss-min / 10)
#   batchsize  <- utils/find_lr.py -cn toptagxl ... +lr_find.find_batch_size=true
#
# Both knobs are the swept jc_ParticleNetParTGraphTrans values, unchanged: TopTagXL inputs
# are identical to JetClass (7+10 scalar channels, same multiplicity), so the batch-size
# memory ceiling transfers as is, and the lr is the 2026-08-16 table-wide decision
# (1e-3 AdamW) the jc family carries -- lr scale is set by optimizer + batch +
# architecture, not by the dataset, and only the loss changed (binary sigmoid vs
# 10-class softmax; upstream itself runs XL under the JetClass recipe). NOTE: a bare
# '???' here would be a human-facing marker only -- the recipe would silently run at the
# inherited tag_default 512 / 1e-3, which is why run.py::_check_recipe_is_swept refuses
# to launch one.
defaults:
  - xl_gts_and_friends_default

# lr/batchsize = jc_ParticleNetParTGraphTrans: carried from the 2026-08-16 top-tagging
# table-wide decision (1e-3 AdamW bs512 -- validated on PNPT 0.9414 vs weaver 0.9417; lr
# scale is set by optimizer+batch+architecture, not dataset size, and the lgatr-paper
# precedent trained non-lgatr models with jc_ParT <- top_ParT values unchanged). Optional
# pre-flight on the xl task: the find_batch_size sweep above (memory: the wider inputs)
# and one aligned find_lr -cn toptagxl read (should agree with 1e-3 within ~2x).
batchsize: 512
lr: 1e-3
