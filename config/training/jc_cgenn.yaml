# JetClass training recipe for tag_cgenn (pure CGENN, flash arm), created 2026-08-19
# at the flash adoption:
#   python run.py -cn jctagging model=tag_cgenn training=jc_cgenn gpus=1
#
# lr/batchsize CARRIED from top_cgenn (512 / 1e-3, operator-rounded) per the
# operator's convention call ("jc lr and batch size the same as the other config,
# that's what the other models do" -- the filled jc hybrid recipes carry their top
# values the same way). The full lr rationale (split 512 sweeps, sqrt-map 1.11e-3
# rounded to the family point, fallback ladder) lives in top_cgenn.yaml and
# transfers unchanged: lr depends on optimizer+batch+loss geometry, not on the
# dataset's width.
#
# MEMORY: the carried 512 was probe-safe on top-tagging (75.6 GB worst case at
# P_max=160). JetClass pads to length=128 and its jets are wider-featured; before
# queueing the row, verify once with the CALIBRATED-TAIL streaming probe (find_lr
# constructs the z = sqrt(2 ln N_run_batches) tail of the batch-total distribution
# from sampled jet stats -- the worst batch the run expects to see once, NOT the
# padded ceiling no real batch attains; reworked 2026-08-19 after external audit):
#   python utils/find_bs.py --task jctagging --models cgenn
# and transcribe here if it reports < 512.
defaults:
  - jc_gts_and_friends_default

batchsize: 512
lr: 1e-3
