# JetClass training recipe for tag_PlainGraphTrans -- fill in the (???) keys, then:
#   python run.py -cn jctagging model=tag_PlainGraphTrans training=jc_PlainGraphTrans gpus=1
#
#   lr         <- utils/find_lr.py -cn jctagging model=tag_PlainGraphTrans         (reported loss-min / 10)
#   batchsize  <- utils/find_lr.py -cn jctagging ... +lr_find.find_batch_size=true
#   (epochs=5 + CosineAnnealingWarmup + weight_decay=0 are shared in jc_gts_and_friends_default)
#
# Re-sweep BOTH knobs on the jctagging task rather than copying the top_PlainGraphTrans values:
# JetClass inputs are wider (7+10 scalar channels), so the memory ceiling and the
# loss-vs-lr curve both move. NOTE: '???' is a human-facing marker only -- left
# unfilled, the recipe silently runs at the inherited tag_default 512 / 1e-3.
defaults:
  - jc_gts_and_friends_default

# lr/batchsize: carried from the 2026-08-16 top-tagging table-wide decision (1e-3 AdamW
# bs512 -- validated on PNPT 0.9414 vs weaver 0.9417; lr scale is set by optimizer+batch+
# architecture, not dataset size, and the lgatr-paper precedent trained non-lgatr models
# with jc_ParT <- top_ParT values unchanged). Optional pre-flight on the jc task:
#   utils/find_bs.py --task jctagging (memory: wider jc inputs) and one aligned
#   find_lr -cn jctagging read (should agree with 1e-3 within ~2x).
batchsize: 512
lr: 1e-3
